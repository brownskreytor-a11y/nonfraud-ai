<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NonFraud-AI | Admin Sign-In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #141B2E;
            --paper: #EEF1F4;
            --surface: #FFFFFF;
            --navy: #1F3358;
            --brass: #A9722E;
            --brass-dark: #8C5E24;
            --danger: #8C2F2F;
            --muted: #5B6472;
            --hairline: #D8DCE2;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: var(--paper);
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border: 1px solid var(--hairline);
            border-top: 3px solid var(--navy);
            border-radius: 4px;
            padding: 36px 32px;
        }
        @media (max-width: 400px) {
            .panel { padding: 28px 22px; }
        }
        .wordmark {
            font-family: 'Source Serif 4', serif;
            font-weight: 600;
            font-size: 22px;
            margin-bottom: 4px;
        }
        .wordmark span { color: var(--brass); }
        .subtitle { font-size: 13px; color: var(--muted); margin: 0 0 26px; font-family: 'IBM Plex Mono', monospace; }

        .alert {
            background: #F6E9E9;
            color: var(--danger);
            border: 1px solid #E3C7C7;
            border-radius: 3px;
            padding: 10px 14px;
            font-size: 13.5px;
            margin-bottom: 20px;
        }

        .field { margin-bottom: 18px; }
        label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 7px; }
        input {
            width: 100%;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14.5px;
            padding: 10px 2px;
            border: none;
            border-bottom: 1.5px solid var(--hairline);
            background: transparent;
            color: var(--ink);
        }
        input:focus { outline: none; border-bottom-color: var(--navy); }

        button {
            width: 100%;
            background: var(--navy);
            color: white;
            border: none;
            padding: 13px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 500;
            font-size: 14.5px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.15s;
        }
        button:hover { background: #16264a; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
        }
        .back-link:hover { color: var(--ink); }

        .default-creds {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px dashed var(--hairline);
            text-align: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--muted);
        }
        .default-creds strong { color: var(--ink); font-weight: 500; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="wordmark">Non<span>Fraud</span>-AI</div>
        <p class="subtitle">Administrator Sign-In</p>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>

        <a href="{{ url_for('transaction_intake') }}" class="back-link">Back to Transaction Intake</a>

        <div class="default-creds">Default login: <strong>admin</strong> / <strong>password123</strong></div>
    </div>
</body>
</html>
